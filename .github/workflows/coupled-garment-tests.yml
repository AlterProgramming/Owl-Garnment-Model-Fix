name: Coupled garment experiment

on:
  pull_request:
    paths:
      - "meshforge/coupling.py"
      - "meshforge/owl_pipeline_coupled.py"
      - "tests/meshforge/test_coupling.py"
      - "tools/wrap_coupling_diag.py"
      - ".github/workflows/coupled-garment-tests.yml"
  workflow_dispatch:

jobs:
  coupling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy trimesh pygltflib pillow
      - name: Run coupling regression tests
        run: PYTHONPATH=. python -m pytest tests/meshforge/test_coupling.py -q
      - name: Compile experiment entry points
        run: python -m py_compile meshforge/coupling.py meshforge/owl_pipeline_coupled.py tools/wrap_coupling_diag.py
