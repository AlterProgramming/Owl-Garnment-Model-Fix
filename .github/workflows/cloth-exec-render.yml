name: cloth-exec-render

on:
  push:
    branches:
      - agent/contact-driven-cloth-exec
    paths:
      - "meshforge/**"
      - "tools/build_cloth_exec.py"
      - "tools/owl_shots.py"
      - ".github/workflows/cloth-exec-render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-driven-cloth-exec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mesh pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy trimesh pygltflib pillow xatlas playwright
          python -m playwright install --with-deps chromium

      - name: Build shoulder-supported garment
        run: |
          mkdir -p build/exec shots/exec
          PYTHONPATH=. python3 tools/build_cloth_exec.py \
            --hires "assets/AI-CCORE Owl.glb" \
            --out build/exec/owl-shoulder-cloth.glb \
            --cache .owl_cache \
            --faces 14000 \
            --tex 512 \
            --jpeg-quality 82 \
            --eye-subdiv 2 \
            --decal-height 256 \
            --kente \
            --kente-style wrap \
            --beads \
            --cloth-res 76,42

      - name: Render actual GLB
        run: |
          PYTHONPATH=. python3 tools/owl_shots.py build/exec/owl-shoulder-cloth.glb \
            --out shots/exec \
            --size 900 \
            --zoom 0.96 \
            --view front:0:0 \
            --view front34:-28:2 \
            --view side:-90:0 \
            --view back:180:0
          PYTHONPATH=. python3 tools/owl_shots.py build/exec/owl-shoulder-cloth.glb \
            --out shots/exec \
            --size 900 \
            --zoom 0.96 \
            --prefix wave_ \
            --clip wave=0.85 \
            --view front:0:0 \
            --view front34:-28:2

      - name: Publish branch render
        run: |
          rm -rf exec-output
          mkdir -p exec-output
          cp build/exec/owl-shoulder-cloth.glb exec-output/
          cp build/exec/owl-shoulder-cloth.report.json exec-output/
          cp shots/exec/*.png exec-output/
          cp shots/exec/*.json exec-output/ || true
          cp shots/exec/*.txt exec-output/ || true
          git config user.name "cloth-exec-bot"
          git config user.email "cloth-exec-bot@users.noreply.github.com"
          git add exec-output
          git diff --cached --quiet && exit 0
          git commit -m "Render shoulder cloth execution [skip ci]"
          git push origin HEAD:agent/contact-driven-cloth-exec

      - name: Upload executable evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloth-exec-render
          if-no-files-found: error
          path: exec-output/
